<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Přihlášení — Kateřina Inachis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #faf8f5;
      --bg-alt:      #f2ede5;
      --ink:         #18141f;
      --ink-mid:     #4a3f5c;
      --ink-dim:     #8a7a9b;
      --violet:      #3a1f5a;
      --violet-mid:  #6b3d8a;
      --violet-pale: #ece5f5;
      --gold:        #b0885a;
      --border:      #e0d6c8;
      --white:       #ffffff;
      --error:       #8b3a3a;
      --error-bg:    #f5e8e8;
      --font-display:'EB Garamond', Georgia, serif;
      --font-body:   'Inter', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font-body);
      background: var(--bg-alt);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-wrap {
      width: 100%;
      max-width: 400px;
    }
    .login-card {
      background: var(--white);
      border-radius: 2px;
      box-shadow: 0 4px 32px rgba(24,20,31,0.1);
      padding: 2.5rem 2.5rem 2rem;
    }
    .login-logo {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 400;
      font-size: 2rem;
      color: var(--violet);
      letter-spacing: 0.04em;
      text-align: center;
      display: block;
      margin-bottom: 0.25rem;
      text-decoration: none;
    }
    .login-role {
      text-align: center;
      font-family: var(--font-body);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-bottom: 2rem;
    }
    .ornament {
      width: 40px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 2rem;
      opacity: 0.7;
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-label {
      display: block;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--ink-mid);
      margin-bottom: 0.4rem;
    }
    .form-input {
      width: 100%;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 1px;
      padding: 0.65rem 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .form-input:focus {
      border-color: var(--violet-mid);
      background: var(--white);
      box-shadow: 0 0 0 3px var(--violet-pale);
    }
    .btn-login {
      width: 100%;
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--violet);
      color: var(--white);
      border: none;
      border-radius: 1px;
      padding: 0.8rem 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }
    .btn-login:hover { background: var(--violet-mid); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-error {
      background: var(--error-bg);
      color: var(--error);
      font-family: var(--font-body);
      font-size: 0.82rem;
      padding: 0.75rem 1rem;
      border-radius: 1px;
      margin-top: 1rem;
      display: none;
    }
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
    }
    .login-footer a {
      font-family: var(--font-body);
      font-size: 0.78rem;
      color: var(--ink-dim);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }
    .login-footer a:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <a href="/" class="login-logo">Kateřina Inachis</a>
      <div class="login-role">Správa webu</div>
      <div class="ornament"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input class="form-input" type="email" id="email" name="email" required autocomplete="email" placeholder="admin@inachis.art">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Heslo</label>
          <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn-login" type="submit" id="loginBtn">Přihlásit se</button>
        <div class="login-error" id="loginError"></div>
      </form>

      <div class="login-footer">
        <a href="/">← Zpět na web</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { AuthManager } from '/js/auth.js';

    const auth = new AuthManager();

    // If already logged in, redirect based on role
    if (auth.isLoggedIn()) {
      const role = auth.getRole();
      window.location.href = role === 'friend' ? '/friend-portal' : '/admin';
    }

    const form    = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const btn     = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Přihlašuji…';
      errorEl.style.display = 'none';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email:    document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          })
        });

        const contentType = response.headers.get('content-type');

        if (!response.ok) {
          const err = contentType?.includes('application/json')
            ? await response.json()
            : { error: await response.text() };
          throw new Error(err.error || 'Přihlášení selhalo');
        }

        if (!contentType?.includes('application/json')) {
          throw new Error('Neočekávaná odpověď serveru');
        }

        const data = await response.json();
        auth.setToken(data.token);
        const role = data.user?.role;
        window.location.href = role === 'friend' ? '/friend-portal' : '/admin';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Přihlásit se';
      }
    });
  </script>
</body>
</html>
